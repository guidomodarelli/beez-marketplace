[features]
hooks = true

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'AOC_PROVIDER=codex bash "$(git rev-parse --show-toplevel)/.agents/hooks/build-context.sh"'
timeout = 180 # seconds
statusMessage = "Installing AI assets (skills, namespaces, marketplaces)... please wait"

[[hooks.PostToolUse]]
matcher = "Write|Edit|MultiEdit|apply_patch"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'bash "$(git rev-parse --show-toplevel)/.agents/hooks/plugin-change.sh"'
timeout = 30
statusMessage = "Checking plugin context optimization..."
